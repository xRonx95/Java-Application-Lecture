<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a database table</title><desc id="d">The students table with fields, records, primary key and data types labeled.</desc>
  <rect width="960" height="520" rx="28" fill="#edf4f8"/><rect x="100" y="97" width="760" height="330" rx="18" fill="#fff" stroke="#bed0dc" stroke-width="2"/>
  <rect x="100" y="97" width="760" height="72" rx="18" fill="#102a43"/><rect x="100" y="140" width="760" height="29" fill="#102a43"/>
  <g font-family="Arial" fill="#fff" font-size="18" font-weight="700"><text x="150" y="140">id</text><text x="268" y="140">student_number</text><text x="488" y="140">full_name</text><text x="706" y="140">course</text></g>
  <g stroke="#d6e0e8"><line x1="100" y1="234" x2="860" y2="234"/><line x1="100" y1="299" x2="860" y2="299"/><line x1="100" y1="364" x2="860" y2="364"/><line x1="220" y1="97" x2="220" y2="427"/><line x1="438" y1="97" x2="438" y2="427"/><line x1="650" y1="97" x2="650" y2="427"/></g>
  <rect x="100" y="169" width="760" height="65" fill="#e8f5fc"/>
  <g font-family="Arial" fill="#263849" font-size="17"><text x="150" y="208">1</text><text x="268" y="208">2026-0001</text><text x="488" y="208">Maria Santos</text><text x="706" y="208">BSIT</text><text x="150" y="273">2</text><text x="268" y="273">2026-0002</text><text x="488" y="273">Jose Reyes</text><text x="706" y="273">BSCS</text><text x="150" y="338">3</text><text x="268" y="338">2026-0003</text><text x="488" y="338">Ana Cruz</text><text x="706" y="338">BSIT</text></g>
  <g font-family="Arial" font-size="15" font-weight="700"><rect x="119" y="383" width="72" height="27" rx="13" fill="#fff5d8"/><text x="155" y="402" text-anchor="middle" fill="#8b6513">INT · PK</text><rect x="250" y="383" width="158" height="27" rx="13" fill="#e7f3fb"/><text x="329" y="402" text-anchor="middle" fill="#1769aa">VARCHAR(30)</text><rect x="464" y="383" width="158" height="27" rx="13" fill="#e7f3fb"/><text x="543" y="402" text-anchor="middle" fill="#1769aa">VARCHAR(150)</text><rect x="679" y="383" width="130" height="27" rx="13" fill="#e7f3fb"/><text x="744" y="402" text-anchor="middle" fill="#1769aa">VARCHAR(100)</text></g>
  <g font-family="Arial" font-weight="700" fill="#102a43"><text x="100" y="65" font-size="26">students</text><text x="710" y="65" font-size="16">COLUMN = FIELD</text><text x="45" y="206" font-size="16" transform="rotate(-90 45 206)">ROW = RECORD</text><text x="100" y="470" font-size="16">PK = PRIMARY KEY</text><text x="772" y="470" font-size="16">DATA TYPES</text></g>
</svg>
