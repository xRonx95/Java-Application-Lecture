<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Run SQL in phpMyAdmin</title><desc id="d">SQL tab, editor with CREATE TABLE command and Go button.</desc>
  <rect width="960" height="540" rx="28" fill="#e7eff4"/><rect x="48" y="42" width="864" height="456" rx="18" fill="#fff" stroke="#bbcdd8" stroke-width="2"/><rect x="48" y="42" width="864" height="58" rx="18" fill="#263849"/><rect x="48" y="80" width="864" height="20" fill="#263849"/><text x="82" y="79" fill="#fff" font-family="Arial" font-size="20" font-weight="700">database_lesson</text>
  <rect x="48" y="100" width="864" height="53" fill="#f1f4f6"/><g font-family="Arial" font-size="15" font-weight="700" fill="#40576a"><text x="82" y="133">Structure</text><rect x="169" y="100" width="67" height="53" fill="#e7f3fb"/><text x="190" y="133" fill="#1769aa">SQL</text><text x="265" y="133">Search</text><text x="338" y="133">Query</text><text x="398" y="133">Export</text><text x="466" y="133">Import</text></g>
  <text x="82" y="195" fill="#263849" font-family="Arial" font-size="23" font-weight="700">Run SQL query on database_lesson</text><rect x="82" y="218" width="796" height="202" rx="9" fill="#0c1c2c"/>
  <g font-family="Consolas, monospace" font-size="16"><text x="108" y="251" fill="#74c0ee">CREATE TABLE</text><text x="240" y="251" fill="#fff"> students (</text><text x="127" y="282" fill="#fff">id </text><text x="154" y="282" fill="#f3c969">INT UNSIGNED AUTO_INCREMENT PRIMARY KEY</text><text x="495" y="282" fill="#fff">,</text><text x="127" y="313" fill="#fff">student_number </text><text x="270" y="313" fill="#f3c969">VARCHAR(30) NOT NULL UNIQUE</text><text x="127" y="344" fill="#fff">full_name </text><text x="229" y="344" fill="#f3c969">VARCHAR(150) NOT NULL</text><text x="449" y="344" fill="#fff">,</text><text x="127" y="375" fill="#fff">email </text><text x="187" y="375" fill="#f3c969">VARCHAR(150) NOT NULL UNIQUE</text><text x="108" y="406" fill="#fff">);</text></g>
  <rect x="767" y="439" width="111" height="40" rx="7" fill="#1769aa"/><text x="822" y="465" text-anchor="middle" fill="#fff" font-family="Arial" font-size="16" font-weight="700">Go</text><circle cx="890" cy="458" r="24" fill="#fff5d8" stroke="#d5a021" stroke-width="3"/><text x="890" y="465" text-anchor="middle" fill="#8b6513" font-family="Arial" font-size="20" font-weight="700">3</text><circle cx="203" cy="127" r="24" fill="#fff5d8" stroke="#d5a021" stroke-width="3"/><text x="203" y="134" text-anchor="middle" fill="#8b6513" font-family="Arial" font-size="20" font-weight="700">1</text><circle cx="890" cy="245" r="24" fill="#fff5d8" stroke="#d5a021" stroke-width="3"/><text x="890" y="252" text-anchor="middle" fill="#8b6513" font-family="Arial" font-size="20" font-weight="700">2</text>
</svg>
