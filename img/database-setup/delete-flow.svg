<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Safe DELETE decision flow</title>
  <desc id="desc">A decision diagram requiring row selection and confirmation before deleting by primary key.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f7eeee"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0d2138" flood-opacity=".11"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#59687a"/></marker></defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0d2138">Safe DELETE Decision Flow</text>
  <g fill="none" stroke="#59687a" stroke-width="4" marker-end="url(#a)"><path d="M220 178h90"/><path d="M480 178h100"/><path d="M750 178h90"/><path d="M1010 178h80v218H950"/><path d="M665 258v72"/><path d="M580 396H440"/><path d="M665 462v38"/></g>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <g><rect x="55" y="112" width="165" height="132" rx="18" fill="#fff" stroke="#cbd6df"/><circle cx="137" cy="157" r="24" fill="#2563a8"/><path d="M125 157l9 9 18-21" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="137" y="211" text-anchor="middle" font-size="16" font-weight="700" fill="#0d2138">Select a row</text></g>
    <g><polygon points="395,90 480,178 395,266 310,178" fill="#fff3d7" stroke="#d7a33b" stroke-width="2"/><text x="395" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#6b4a0f">Valid ID</text><text x="395" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#6b4a0f">selected?</text></g>
    <g><polygon points="665,90 750,178 665,266 580,178" fill="#fff3d7" stroke="#d7a33b" stroke-width="2"/><text x="665" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#6b4a0f">User confirms</text><text x="665" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#6b4a0f">deletion?</text></g>
    <g><rect x="840" y="112" width="170" height="132" rx="18" fill="#fcebea" stroke="#a93636" stroke-width="2"/><rect x="875" y="142" width="100" height="43" rx="7" fill="#a93636"/><text x="925" y="169" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">DELETE SQL</text><text x="925" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#702b2b">WHERE id = ?</text></g>
    <g><rect x="580" y="330" width="170" height="132" rx="18" fill="#eef3f7" stroke="#9baab8"/><path d="M625 371h80M625 389h55" stroke="#59687a" stroke-width="6" stroke-linecap="round"/><text x="665" y="431" text-anchor="middle" font-size="16" font-weight="700" fill="#0d2138">Cancel safely</text></g>
    <g><rect x="270" y="330" width="170" height="132" rx="18" fill="#eef3f7" stroke="#9baab8"/><circle cx="355" cy="372" r="24" fill="#59687a"/><text x="355" y="379" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">!</text><text x="355" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#0d2138">Request selection</text></g>
    <g><rect x="780" y="330" width="170" height="132" rx="18" fill="#e6f5ed" stroke="#17633f" stroke-width="2"/><path d="M825 373l18 18 37-42" fill="none" stroke="#17633f" stroke-width="8" stroke-linecap="round"/><text x="865" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#194f36">Report and refresh</text></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="800"><text x="258" y="163" fill="#17633f">YES</text><text x="399" y="304" fill="#a93636">NO</text><text x="521" y="163" fill="#17633f">YES</text><text x="678" y="304" fill="#a93636">NO</text></g>
  <rect x="468" y="501" width="394" height="38" rx="19" fill="#fcebea" stroke="#e4aaa6"/><text x="665" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#8b3030">Deletion proceeds only after both safety decisions pass.</text>
</svg>
