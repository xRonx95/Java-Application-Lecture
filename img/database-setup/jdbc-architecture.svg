<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">JDBC architecture</title>
  <desc id="desc">A five-stage path from a user action in a JFrame application to a MySQL database and back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#e7f2fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0d2138" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#337bc1"/></marker>
  </defs>
  <rect width="1200" height="520" rx="26" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0d2138">From a JFrame Event to a Database Result</text>
  <path d="M212 248 H290 M430 248 H508 M648 248 H726 M866 248 H944" fill="none" stroke="#337bc1" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M988 346 C870 450 330 450 212 346" fill="none" stroke="#d7a33b" stroke-width="5" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="56" y="148" width="156" height="200" rx="18" fill="#fff" stroke="#c4d5e4" stroke-width="2"/>
    <circle cx="134" cy="205" r="29" fill="#e9f3fc"/><circle cx="134" cy="198" r="10" fill="#2563a8"/><path d="M111 229c5-18 41-18 46 0" fill="#2563a8"/>
    <text x="134" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0d2138">User Action</text>
    <text x="134" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#59687a">Click UPDATE</text>
    <text x="134" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#59687a">or DELETE</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="290" y="148" width="140" height="200" rx="18" fill="#fff" stroke="#c4d5e4" stroke-width="2"/>
    <rect x="325" y="181" width="70" height="54" rx="7" fill="#15334f"/><circle cx="341" cy="198" r="5" fill="#d7a33b"/><path d="M337 218h42" stroke="#d9e7f2" stroke-width="5" stroke-linecap="round"/>
    <text x="360" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0d2138">JFrame</text>
    <text x="360" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#59687a">ActionListener</text>
    <text x="360" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#59687a">validates input</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="508" y="148" width="140" height="200" rx="18" fill="#fff" stroke="#c4d5e4" stroke-width="2"/>
    <rect x="541" y="182" width="74" height="50" rx="10" fill="#2563a8"/><text x="578" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#fff">JDBC</text>
    <text x="578" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0d2138">JDBC API</text>
    <text x="578" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#59687a">Connection</text>
    <text x="578" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#59687a">PreparedStatement</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="726" y="148" width="140" height="200" rx="18" fill="#fff" stroke="#c4d5e4" stroke-width="2"/>
    <path d="M765 223l31-42 31 42z" fill="#d7a33b"/><circle cx="796" cy="210" r="9" fill="#0d2138"/><text x="796" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0d2138">MySQL Driver</text>
    <text x="796" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#59687a">Translates JDBC</text>
    <text x="796" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#59687a">into MySQL protocol</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="944" y="148" width="200" height="200" rx="18" fill="#0d2138"/>
    <ellipse cx="1044" cy="201" rx="48" ry="18" fill="#4f8fbd"/><rect x="996" y="201" width="96" height="64" fill="#337bc1"/><ellipse cx="1044" cy="265" rx="48" ry="18" fill="#2563a8"/><path d="M996 219c0 10 21 18 48 18s48-8 48-18M996 242c0 10 21 18 48 18s48-8 48-18" fill="none" stroke="#9dd1f1" stroke-width="2"/>
    <text x="1044" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">MySQL Database</text>
    <text x="1044" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c9d9e7">students table</text>
  </g>
  <rect x="430" y="407" width="340" height="53" rx="26" fill="#fff3d7" stroke="#d7a33b" stroke-width="2"/>
  <text x="600" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#6f4b0a">Affected-row count and status return to the interface</text>
</svg>
