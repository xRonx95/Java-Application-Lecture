<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">PreparedStatement parameter mapping</title>
  <desc id="desc">Five SQL placeholders connected to five Java setter calls and student values.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d2138"/><stop offset="1" stop-color="#163f62"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#d7a33b"/></marker></defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">PreparedStatement: Placeholder-to-Value Mapping</text>
  <rect x="62" y="82" width="1076" height="108" rx="16" fill="#081425" stroke="#466984"/>
  <text x="90" y="118" font-family="Consolas, monospace" font-size="20" fill="#f2ce81">UPDATE students</text>
  <text x="90" y="151" font-family="Consolas, monospace" font-size="20" fill="#d7e6f2">SET full_name = <tspan fill="#7fc2ef" font-weight="700">?</tspan>, course = <tspan fill="#7fc2ef" font-weight="700">?</tspan>, year_level = <tspan fill="#7fc2ef" font-weight="700">?</tspan>, email = <tspan fill="#7fc2ef" font-weight="700">?</tspan></text>
  <text x="90" y="178" font-family="Consolas, monospace" font-size="20" fill="#d7e6f2">WHERE student_id = <tspan fill="#7fc2ef" font-weight="700">?</tspan></text>
  <g stroke="#d7a33b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M205 194c0 45-68 37-68 89"/><path d="M386 194c0 41-24 45-24 89"/><path d="M608 194v89"/><path d="M788 194c0 41 48 45 48 89"/><path d="M320 182c110 69 741 29 741 101"/></g>
  <g font-family="Arial, sans-serif">
    <g><rect x="54" y="286" width="168" height="142" rx="14" fill="#fff"/><circle cx="84" cy="316" r="18" fill="#2563a8"/><text x="84" y="322" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1</text><text x="138" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#0d2138">setString(1, name)</text><rect x="79" y="373" width="118" height="29" rx="14" fill="#e9f3fc"/><text x="138" y="393" text-anchor="middle" font-size="13" fill="#2563a8">Ana Reyes</text></g>
    <g><rect x="286" y="286" width="168" height="142" rx="14" fill="#fff"/><circle cx="316" cy="316" r="18" fill="#2563a8"/><text x="316" y="322" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">2</text><text x="370" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#0d2138">setString(2, course)</text><rect x="310" y="373" width="120" height="29" rx="14" fill="#e9f3fc"/><text x="370" y="393" text-anchor="middle" font-size="13" fill="#2563a8">BSIT</text></g>
    <g><rect x="518" y="286" width="168" height="142" rx="14" fill="#fff"/><circle cx="548" cy="316" r="18" fill="#2563a8"/><text x="548" y="322" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">3</text><text x="602" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#0d2138">setInt(3, year)</text><rect x="542" y="373" width="120" height="29" rx="14" fill="#e9f3fc"/><text x="602" y="393" text-anchor="middle" font-size="13" fill="#2563a8">3</text></g>
    <g><rect x="750" y="286" width="168" height="142" rx="14" fill="#fff"/><circle cx="780" cy="316" r="18" fill="#2563a8"/><text x="780" y="322" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">4</text><text x="834" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#0d2138">setString(4, email)</text><rect x="774" y="373" width="120" height="29" rx="14" fill="#e9f3fc"/><text x="834" y="393" text-anchor="middle" font-size="12" fill="#2563a8">ana@school.edu</text></g>
    <g><rect x="982" y="286" width="168" height="142" rx="14" fill="#fff"/><circle cx="1012" cy="316" r="18" fill="#d7a33b"/><text x="1012" y="322" text-anchor="middle" font-size="15" font-weight="800" fill="#0d2138">5</text><text x="1066" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#0d2138">setInt(5, id)</text><rect x="1006" y="373" width="120" height="29" rx="14" fill="#fff3d7"/><text x="1066" y="393" text-anchor="middle" font-size="13" fill="#8a5a09">student_id = 1</text></g>
  </g>
  <text x="600" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#d6e4ef">Positions start at 1 and must match the placeholders from left to right.</text>
</svg>
