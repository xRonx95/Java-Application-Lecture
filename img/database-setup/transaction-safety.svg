<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Database safety layers</title>
  <desc id="desc">Six protective layers surrounding a database record.</desc>
  <defs><radialGradient id="bg"><stop stop-color="#fafdff"/><stop offset="1" stop-color="#e7f2fb"/></radialGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0d2138" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0d2138">Six Layers of Data-Modification Safety</text>
  <g filter="url(#s)">
    <circle cx="600" cy="300" r="170" fill="#dcecf8" stroke="#9dc4e1" stroke-width="2"/>
    <circle cx="600" cy="300" r="124" fill="#bcd9ed" stroke="#6ea5ca" stroke-width="2"/>
    <circle cx="600" cy="300" r="78" fill="#15334f"/>
    <ellipse cx="600" cy="280" rx="38" ry="14" fill="#6eacd6"/><rect x="562" y="280" width="76" height="53" fill="#337bc1"/><ellipse cx="600" cy="333" rx="38" ry="14" fill="#2563a8"/><path d="M562 296c0 8 17 14 38 14s38-6 38-14M562 315c0 8 17 14 38 14s38-6 38-14" fill="none" stroke="#bce0f6" stroke-width="2"/>
    <text x="600" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0d2138">PROTECTED RECORD</text>
  </g>
  <g font-family="Arial, sans-serif">
    <g><rect x="62" y="118" width="250" height="75" rx="14" fill="#fff" stroke="#c3d3df"/><circle cx="98" cy="155" r="20" fill="#2563a8"/><text x="98" y="161" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1</text><text x="132" y="148" font-size="16" font-weight="700" fill="#0d2138">Input validation</text><text x="132" y="170" font-size="13" fill="#59687a">Reject invalid values early</text><path d="M312 155l140 77" stroke="#337bc1" stroke-width="3" stroke-dasharray="7 6"/></g>
    <g><rect x="62" y="238" width="250" height="75" rx="14" fill="#fff" stroke="#c3d3df"/><circle cx="98" cy="275" r="20" fill="#2563a8"/><text x="98" y="281" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">2</text><text x="132" y="268" font-size="16" font-weight="700" fill="#0d2138">PreparedStatement</text><text x="132" y="290" font-size="13" fill="#59687a">Keep values separate from SQL</text><path d="M312 275l114 16" stroke="#337bc1" stroke-width="3" stroke-dasharray="7 6"/></g>
    <g><rect x="62" y="358" width="250" height="75" rx="14" fill="#fff" stroke="#c3d3df"/><circle cx="98" cy="395" r="20" fill="#2563a8"/><text x="98" y="401" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">3</text><text x="132" y="388" font-size="16" font-weight="700" fill="#0d2138">Key-based WHERE</text><text x="132" y="410" font-size="13" fill="#59687a">Target exactly one record</text><path d="M312 395l140-40" stroke="#337bc1" stroke-width="3" stroke-dasharray="7 6"/></g>
    <g><rect x="888" y="118" width="250" height="75" rx="14" fill="#fff" stroke="#c3d3df"/><circle cx="924" cy="155" r="20" fill="#d7a33b"/><text x="924" y="161" text-anchor="middle" font-size="15" font-weight="800" fill="#0d2138">4</text><text x="958" y="148" font-size="16" font-weight="700" fill="#0d2138">User confirmation</text><text x="958" y="170" font-size="13" fill="#59687a">Confirm destructive intent</text><path d="M888 155l-140 77" stroke="#d7a33b" stroke-width="3" stroke-dasharray="7 6"/></g>
    <g><rect x="888" y="238" width="250" height="75" rx="14" fill="#fff" stroke="#c3d3df"/><circle cx="924" cy="275" r="20" fill="#d7a33b"/><text x="924" y="281" text-anchor="middle" font-size="15" font-weight="800" fill="#0d2138">5</text><text x="958" y="268" font-size="16" font-weight="700" fill="#0d2138">Transaction control</text><text x="958" y="290" font-size="13" fill="#59687a">Commit or roll back together</text><path d="M888 275l-114 16" stroke="#d7a33b" stroke-width="3" stroke-dasharray="7 6"/></g>
    <g><rect x="888" y="358" width="250" height="75" rx="14" fill="#fff" stroke="#c3d3df"/><circle cx="924" cy="395" r="20" fill="#d7a33b"/><text x="924" y="401" text-anchor="middle" font-size="15" font-weight="800" fill="#0d2138">6</text><text x="958" y="388" font-size="16" font-weight="700" fill="#0d2138">Result verification</text><text x="958" y="410" font-size="13" fill="#59687a">Check rows and inform user</text><path d="M888 395l-140-40" stroke="#d7a33b" stroke-width="3" stroke-dasharray="7 6"/></g>
  </g>
  <rect x="383" y="489" width="434" height="42" rx="21" fill="#0d2138"/><text x="600" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">No single control replaces the others.</text>
</svg>
