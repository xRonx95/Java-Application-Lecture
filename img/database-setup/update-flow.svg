<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Safe UPDATE workflow</title>
  <desc id="desc">Five numbered stages for selecting, editing, validating, executing, and refreshing a student record.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fbfe"/><stop offset="1" stop-color="#e8f3fb"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0d2138" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#337bc1"/></marker></defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0d2138">Recommended UPDATE Sequence</text>
  <path d="M220 210h50M450 210h50M680 210h50M910 210h50" stroke="#337bc1" stroke-width="6" stroke-linecap="round" marker-end="url(#a)"/>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <g><rect x="40" y="112" width="180" height="196" rx="18" fill="#fff" stroke="#c8d8e5"/><circle cx="80" cy="151" r="21" fill="#0d2138"/><text x="80" y="158" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">1</text><rect x="76" y="187" width="108" height="65" rx="6" fill="#e9f3fc" stroke="#337bc1"/><path d="M91 204h78M91 221h78M91 238h52" stroke="#337bc1" stroke-width="5" stroke-linecap="round"/><text x="130" y="281" text-anchor="middle" font-size="16" font-weight="700" fill="#0d2138">Select a row</text></g>
    <g><rect x="270" y="112" width="180" height="196" rx="18" fill="#fff" stroke="#c8d8e5"/><circle cx="310" cy="151" r="21" fill="#0d2138"/><text x="310" y="158" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">2</text><rect x="305" y="190" width="110" height="18" rx="5" fill="#e9f3fc" stroke="#337bc1"/><rect x="305" y="221" width="110" height="18" rx="5" fill="#e9f3fc" stroke="#337bc1"/><text x="360" y="281" text-anchor="middle" font-size="16" font-weight="700" fill="#0d2138">Edit the fields</text></g>
    <g><rect x="500" y="112" width="180" height="196" rx="18" fill="#fff" stroke="#c8d8e5"/><circle cx="540" cy="151" r="21" fill="#0d2138"/><text x="540" y="158" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">3</text><circle cx="590" cy="218" r="38" fill="#e6f5ed" stroke="#17633f" stroke-width="3"/><path d="M570 219l13 13 28-31" fill="none" stroke="#17633f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="281" text-anchor="middle" font-size="16" font-weight="700" fill="#0d2138">Validate input</text></g>
    <g><rect x="730" y="112" width="180" height="196" rx="18" fill="#fff" stroke="#c8d8e5"/><circle cx="770" cy="151" r="21" fill="#0d2138"/><text x="770" y="158" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">4</text><rect x="760" y="190" width="120" height="58" rx="9" fill="#0d2138"/><text x="820" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#f2ce81">UPDATE ...</text><text x="820" y="235" text-anchor="middle" font-size="12" fill="#d5e5f2">WHERE id = ?</text><text x="820" y="281" text-anchor="middle" font-size="16" font-weight="700" fill="#0d2138">Execute SQL</text></g>
    <g><rect x="960" y="112" width="200" height="196" rx="18" fill="#0d2138"/><circle cx="1000" cy="151" r="21" fill="#d7a33b"/><text x="1000" y="158" text-anchor="middle" font-size="17" font-weight="800" fill="#0d2138">5</text><path d="M1014 210c18-20 62-18 78 4" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" marker-end="url(#a)"/><rect x="1018" y="231" width="100" height="23" rx="5" fill="#337bc1"/><text x="1060" y="281" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Refresh JTable</text></g>
  </g>
  <rect x="376" y="344" width="448" height="42" rx="21" fill="#e6f5ed" stroke="#86c5a3"/><text x="600" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17633f">Expected result: exactly one row is affected</text>
</svg>
