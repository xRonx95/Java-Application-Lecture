<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">JDBC connection architecture</title><desc id="d">Java passes JDBC calls through Connector J to a MySQL server and receives results.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07182f"/><stop offset="1" stop-color="#0d5084"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".2"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#f0b429"/></marker></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="70" y="88" fill="#fff" font-family="Segoe UI,Arial" font-size="42" font-weight="700">How a Java–MySQL Connection Works</text><text x="70" y="125" fill="#bdd3e8" font-family="Segoe UI,Arial" font-size="22">JDBC provides the standard API; Connector/J implements it for MySQL.</text>
  <g filter="url(#s)" font-family="Segoe UI,Arial" text-anchor="middle"><rect x="70" y="225" width="230" height="225" rx="24" fill="#fff"/><circle cx="185" cy="290" r="45" fill="#0b69ad"/><text x="185" y="302" fill="#fff" font-size="28" font-weight="800">JAVA</text><text x="185" y="375" fill="#07182f" font-size="27" font-weight="700">Application</text><text x="185" y="410" fill="#637083" font-size="18">Your program</text>
  <rect x="355" y="225" width="205" height="225" rx="24" fill="#e8f4ff"/><circle cx="457" cy="290" r="45" fill="#075ea8"/><text x="457" y="300" fill="#fff" font-size="22" font-weight="800">JDBC</text><text x="457" y="375" fill="#07182f" font-size="27" font-weight="700">Java API</text><text x="457" y="410" fill="#637083" font-size="18">Standard calls</text>
  <rect x="615" y="225" width="220" height="225" rx="24" fill="#fff6d9"/><circle cx="725" cy="290" r="45" fill="#f0b429"/><text x="725" y="300" fill="#07182f" font-size="20" font-weight="900">JAR</text><text x="725" y="375" fill="#07182f" font-size="27" font-weight="700">Connector/J</text><text x="725" y="410" fill="#637083" font-size="18">JDBC driver</text>
  <rect x="890" y="225" width="240" height="225" rx="24" fill="#e9f8f0"/><ellipse cx="1010" cy="278" rx="58" ry="25" fill="#14734a"/><path d="M952 278v70c0 14 26 25 58 25s58-11 58-25v-70" fill="#18885a"/><ellipse cx="1010" cy="348" rx="58" ry="25" fill="#116540"/><text x="1010" y="400" fill="#07182f" font-size="27" font-weight="700">MySQL</text><text x="1010" y="430" fill="#637083" font-size="18">Database server</text></g>
  <g stroke="#f0b429" stroke-width="7" marker-end="url(#a)"><path d="M300 337h42"/><path d="M560 337h42"/><path d="M835 337h42"/></g>
