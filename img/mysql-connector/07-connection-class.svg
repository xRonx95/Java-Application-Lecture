<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Database connection class</title><desc id="d">A Java editor highlights the JDBC URL and DriverManager connection call.</desc><defs><filter id="s"><feDropShadow dy="12" stdDeviation="16" flood-opacity=".24"/></filter></defs><rect width="1200" height="675" fill="#dfe9f4"/><rect x="65" y="48" width="1070" height="575" rx="20" fill="#07182f" filter="url(#s)"/><rect x="65" y="48" width="1070" height="64" rx="20" fill="#0b2342"/><rect x="65" y="91" width="1070" height="21" fill="#0b2342"/><text x="104" y="89" fill="#fff" font-family="Segoe UI,Arial" font-size="23" font-weight="700">DatabaseConnection.java</text><rect x="65" y="112" width="235" height="511" fill="#102b4c"/><g font-family="Segoe UI,Arial"><text x="94" y="158" fill="#93abc3" font-size="15">PROJECTS</text><text x="94" y="204" fill="#fff" font-size="18">▾ MySQLConnectorLesson</text><text x="117" y="243" fill="#cbd9e9" font-size="17">▾ Source Packages</text><text x="141" y="282" fill="#cbd9e9" font-size="17">▾ school.database</text><rect x="126" y="302" width="156" height="42" rx="6" fill="#174a76"/><text x="148" y="329" fill="#fff" font-size="16">DatabaseConnection</text></g><g font-family="Consolas,monospace" font-size="18"><g fill="#607e9b" text-anchor="end"><text x="340" y="156">1</text><text x="340" y="192">2</text><text x="340" y="228">3</text><text x="340" y="264">4</text><text x="340" y="300">5</text><text x="340" y="336">6</text><text x="340" y="372">7</text><text x="340" y="408">8</text><text x="340" y="444">9</text><text x="340" y="480">10</text><text x="340" y="516">11</text><text x="340" y="552">12</text></g><text x="370" y="156" fill="#78c9ff">package <tspan fill="#e9f4ff">school.database;</tspan></text><text x="370" y="228" fill="#78c9ff">import <tspan fill="#e9f4ff">java.sql.*;</tspan></text><text x="370" y="300" fill="#78c9ff">public final class <tspan fill="#ffd56a">DatabaseConnection</tspan> {</text><rect x="356" y="320" width="710" height="70" rx="8" fill="#0f426b" stroke="#f0b429"/><text x="384" y="350" fill="#98e0b9">private static final String URL =</text><text x="410" y="378" fill="#ffd98a">"jdbc:mysql://localhost:3306/school_db";</text><text x="384" y="444" fill="#78c9ff">public static <tspan fill="#ffd56a">Connection</tspan> open() throws SQLException {</text><text x="410" y="480" fill="#78c9ff">return <tspan fill="#e9f4ff">DriverManager.getConnection(URL, USER, PASSWORD);</tspan></text><text x="384" y="516" fill="#e9f4ff">}</text><text x="370" y="552" fill="#e9f4ff">}</text></g><rect x="715" y="566" width="350" height="40" rx="8" fill="#fff6d9"/><text x="890" y="592" text-anchor="middle" fill="#73540e" font-family="Segoe UI,Arial" font-size="16" font-weight="700">URL = protocol + host + port + database</text></svg>
