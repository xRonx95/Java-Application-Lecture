<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Successful database connection test</title><desc id="d">A NetBeans style output window displays a successful connection to school db.</desc><defs><filter id="s"><feDropShadow dy="12" stdDeviation="16" flood-opacity=".2"/></filter></defs><rect width="1200" height="675" fill="#e7eef6"/><rect x="75" y="60" width="1050" height="555" rx="20" fill="#fff" filter="url(#s)"/><rect x="75" y="60" width="1050" height="62" rx="20" fill="#0b2342"/><rect x="75" y="102" width="1050" height="20" fill="#0b2342"/><text x="112" y="100" fill="#fff" font-family="Segoe UI,Arial" font-size="24" font-weight="700">MySQLConnectorLesson — ConnectionTest.java</text><rect x="75" y="122" width="1050" height="270" fill="#07182f"/><g font-family="Consolas,monospace" font-size="19"><text x="115" y="168" fill="#78c9ff">try <tspan fill="#e9f4ff">(Connection connection = DatabaseConnection.open()) {</tspan></text><text x="143" y="208" fill="#e9f4ff">System.out.println(<tspan fill="#98e0b9">"Connection successful."</tspan>);</text><text x="143" y="248" fill="#e9f4ff">System.out.println(<tspan fill="#98e0b9">"Database: "</tspan> + connection.getCatalog());</text><text x="115" y="288" fill="#e9f4ff">}</text></g><rect x="75" y="392" width="1050" height="223" fill="#fff"/><rect x="75" y="392" width="1050" height="48" fill="#f0f3f7"/><text x="108" y="423" fill="#07182f" font-family="Segoe UI,Arial" font-size="18" font-weight="750">Output — ConnectionTest</text><g font-family="Consolas,monospace"><text x="115" y="486" fill="#14734a" font-size="24" font-weight="700">Connection successful.</text><text x="115" y="526" fill="#172033" font-size="22">Database: school_db</text><text x="115" y="574" fill="#637083" font-size="18">BUILD SUCCESSFUL</text></g><circle cx="1015" cy="515" r="60" fill="#e9f8f0" stroke="#14734a" stroke-width="5"/><path d="M986 516l20 20 41-48" fill="none" stroke="#14734a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
