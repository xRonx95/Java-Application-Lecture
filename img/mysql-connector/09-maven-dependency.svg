<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Connector J Maven dependency</title><desc id="d">A pom XML dependency is transformed into an automatically downloaded Connector J library.</desc><defs><filter id="s"><feDropShadow dy="12" stdDeviation="16" flood-opacity=".2"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#f0b429"/></marker></defs><rect width="1200" height="675" fill="#07182f"/><text x="70" y="82" fill="#fff" font-family="Segoe UI,Arial" font-size="39" font-weight="750">Maven can manage Connector/J automatically</text><rect x="70" y="126" width="620" height="470" rx="18" fill="#102b4c" filter="url(#s)"/><rect x="70" y="126" width="620" height="55" rx="18" fill="#174a76"/><rect x="70" y="162" width="620" height="19" fill="#174a76"/><text x="105" y="162" fill="#fff" font-family="Segoe UI,Arial" font-size="20" font-weight="700">pom.xml</text><g font-family="Consolas,monospace" font-size="19"><text x="108" y="235" fill="#78c9ff">&lt;dependency&gt;</text><text x="139" y="284" fill="#e9f4ff">&lt;groupId&gt;<tspan fill="#98e0b9">com.mysql</tspan>&lt;/groupId&gt;</text><text x="139" y="333" fill="#e9f4ff">&lt;artifactId&gt;</text><text x="174" y="370" fill="#98e0b9">mysql-connector-j</text><text x="139" y="407" fill="#e9f4ff">&lt;/artifactId&gt;</text><text x="139" y="456" fill="#e9f4ff">&lt;version&gt;<tspan fill="#ffd56a">x.y.z</tspan>&lt;/version&gt;</text><text x="108" y="505" fill="#78c9ff">&lt;/dependency&gt;</text></g><path d="M720 360h95" stroke="#f0b429" stroke-width="8" marker-end="url(#a)"/><rect x="845" y="202" width="285" height="315" rx="22" fill="#fff" filter="url(#s)"/><circle cx="987" cy="285" r="62" fill="#075ea8"/><path d="M987 245v68m0 0l-27-27m27 27l27-27" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="905" y="374" width="164" height="66" rx="10" fill="#fff6d9" stroke="#dfbd54"/><text x="987" y="402" fill="#73540e" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16">DEPENDENCY</text><text x="987" y="428" fill="#07182f" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="800">Connector/J</text><text x="987" y="480" fill="#14734a" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700">✓ Downloaded</text><text x="600" y="635" fill="#bcd0e4" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20">Declare the coordinates → Maven resolves and adds the library</text></svg>
