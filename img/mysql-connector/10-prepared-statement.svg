<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Prepared statement process</title><desc id="d">Student values are bound separately to SQL placeholders before secure execution.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eef5fb"/><stop offset="1" stop-color="#dbe9f6"/></linearGradient><filter id="s"><feDropShadow dy="10" stdDeviation="14" flood-opacity=".18"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#075ea8"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><text x="70" y="76" fill="#07182f" font-family="Segoe UI,Arial" font-size="39" font-weight="750">PreparedStatement separates SQL from values</text><g filter="url(#s)" font-family="Segoe UI,Arial"><rect x="70" y="125" width="320" height="430" rx="20" fill="#fff"/><text x="105" y="178" fill="#075ea8" font-size="20" font-weight="800">INPUT VALUES</text><g font-size="17"><text x="105" y="230" fill="#637083">Student number</text><rect x="105" y="244" width="250" height="49" rx="8" fill="#f5f8fc" stroke="#c5d0de"/><text x="124" y="275" fill="#172033">2026-001</text><text x="105" y="335" fill="#637083">Full name</text><rect x="105" y="349" width="250" height="49" rx="8" fill="#f5f8fc" stroke="#c5d0de"/><text x="124" y="380" fill="#172033">Sample Student</text><text x="105" y="440" fill="#637083">Program</text><rect x="105" y="454" width="250" height="49" rx="8" fill="#f5f8fc" stroke="#c5d0de"/><text x="124" y="485" fill="#172033">BSIT</text></g><rect x="450" y="125" width="365" height="430" rx="20" fill="#07182f"/><text x="485" y="178" fill="#78c9ff" font-size="20" font-weight="800">PREPARED SQL</text><text x="485" y="235" fill="#e9f4ff" font-family="Consolas,monospace" font-size="18">INSERT INTO students</text><text x="485" y="271" fill="#e9f4ff" font-family="Consolas,monospace" font-size="18">(student_number,</text><text x="485" y="307" fill="#e9f4ff" font-family="Consolas,monospace" font-size="18"> full_name, program)</text><text x="485" y="343" fill="#78c9ff" font-family="Consolas,monospace" font-size="18">VALUES</text><g fill="#ffd56a" font-family="Consolas,monospace" font-size="40" font-weight="800"><text x="501" y="404">?</text><text x="599" y="404">?</text><text x="697" y="404">?</text></g><path d="M503 420v58M601 420v58M699 420v58" stroke="#98e0b9" stroke-width="4"/><text x="632" y="515" fill="#98e0b9" text-anchor="middle" font-size="18" font-weight="700">Values are bound by position</text><rect x="875" y="170" width="255" height="340" rx="20" fill="#e9f8f0"/><ellipse cx="1002" cy="263" rx="66" ry="27" fill="#14734a"/><path d="M936 263v82c0 15 30 27 66 27s66-12 66-27v-82" fill="#18885a"/><ellipse cx="1002" cy="345" rx="66" ry="27" fill="#116540"/><text x="1002" y="420" fill="#07182f" text-anchor="middle" font-size="27" font-weight="800">MySQL</text><text x="1002" y="458" fill="#14734a" text-anchor="middle" font-size="18" font-weight="700">Safe execution</text></g><path d="M390 340h45M815 340h45" stroke="#075ea8" stroke-width="7" marker-end="url(#a)"/><rect x="235" y="590" width="730" height="52" rx="12" fill="#fff"/><text x="600" y="623" text-anchor="middle" fill="#0f5b3c" font-family="Segoe UI,Arial" font-size="20" font-weight="750">✓ Do not concatenate user input into the SQL string</text></svg>
