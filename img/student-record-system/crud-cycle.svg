<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">CRUD record lifecycle</title><desc id="desc">Create, Read, Update, and Delete surround a student record at the center.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#8194a6"/></marker></defs>
  <rect width="900" height="500" rx="20" fill="#eef3f7"/>
  <g fill="none" stroke="#8194a6" stroke-width="4" marker-end="url(#arrow)"><path d="M333 142c65-40 167-40 233 0"/><path d="M638 204c29 53 29 102 0 152"/><path d="M566 408c-66 39-166 39-232 0"/><path d="M262 356c-29-50-29-101 0-152"/></g>
  <g font-family="Segoe UI,Arial">
    <rect x="354" y="194" width="192" height="112" rx="20" fill="#102b4e"/><text x="450" y="235" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">STUDENT</text><text x="450" y="263" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">RECORD</text><text x="450" y="286" text-anchor="middle" font-size="12" fill="#d5e0ea">One data entity</text>
    <rect x="83" y="84" width="210" height="112" rx="18" fill="#1d5f91"/><text x="188" y="126" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">CREATE</text><text x="188" y="157" text-anchor="middle" font-size="14" fill="#e2f0f8">Add a new row</text><text x="188" y="179" text-anchor="middle" font-size="12" fill="#e2f0f8">INSERT / addRow()</text>
    <rect x="607" y="84" width="210" height="112" rx="18" fill="#173b66"/><text x="712" y="126" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">READ</text><text x="712" y="157" text-anchor="middle" font-size="14" fill="#e2f0f8">View or select a row</text><text x="712" y="179" text-anchor="middle" font-size="12" fill="#e2f0f8">SELECT / getValueAt()</text>
    <rect x="607" y="342" width="210" height="112" rx="18" fill="#1d7257"/><text x="712" y="384" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">UPDATE</text><text x="712" y="415" text-anchor="middle" font-size="14" fill="#e7f7f1">Revise a selected row</text><text x="712" y="437" text-anchor="middle" font-size="12" fill="#e7f7f1">UPDATE / setValueAt()</text>
    <rect x="83" y="342" width="210" height="112" rx="18" fill="#a63838"/><text x="188" y="384" text-anchor="middle" font-size="22" font-weight="900" fill="#fff">DELETE</text><text x="188" y="415" text-anchor="middle" font-size="14" fill="#fae8e8">Remove a selected row</text><text x="188" y="437" text-anchor="middle" font-size="12" fill="#fae8e8">DELETE / removeRow()</text>
  </g>
</svg>
