<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Student input form layout</title><desc id="desc">A neat two-column student information form with aligned labels and controls.</desc>
  <rect width="900" height="520" rx="20" fill="#eef3f7"/>
  <rect x="80" y="48" width="740" height="424" rx="18" fill="#fff" stroke="#b9c7d3"/>
  <rect x="80" y="48" width="740" height="76" rx="18" fill="#102b4e"/><rect x="80" y="102" width="740" height="22" fill="#102b4e"/>
  <text x="112" y="93" font-family="Segoe UI,Arial" font-size="25" font-weight="800" fill="#fff">Student Information</text>
  <text x="112" y="150" font-family="Segoe UI,Arial" font-size="13" fill="#526173">Enter the required details before adding a record.</text>
  <g font-family="Segoe UI,Arial" font-size="12" font-weight="700" fill="#405167">
    <text x="112" y="198">STUDENT ID *</text><text x="466" y="198">COMPLETE NAME *</text><text x="112" y="279">PROGRAM *</text><text x="466" y="279">YEAR LEVEL *</text><text x="112" y="360">EMAIL ADDRESS</text><text x="466" y="360">CONTACT NUMBER</text>
  </g>
  <g fill="#fff" stroke="#9eafbd" stroke-width="2">
    <rect x="112" y="210" width="302" height="43" rx="7"/><rect x="466" y="210" width="302" height="43" rx="7"/><rect x="112" y="291" width="302" height="43" rx="7"/><rect x="466" y="291" width="302" height="43" rx="7"/><rect x="112" y="372" width="302" height="43" rx="7"/><rect x="466" y="372" width="302" height="43" rx="7"/>
  </g>
  <g font-family="Segoe UI,Arial" font-size="14" fill="#7b8996"><text x="128" y="237">e.g., 2026-00124</text><text x="482" y="237">e.g., Andrea M. Santos</text><text x="128" y="318">Select program</text><text x="482" y="318">Select year level</text><text x="128" y="399">student@example.edu</text><text x="482" y="399">09XX XXX XXXX</text></g>
  <g fill="#526173"><path d="M394 308l7 7 7-7z"/><path d="M748 308l7 7 7-7z"/></g>
  <rect x="112" y="439" width="656" height="1" fill="#d6dfe7"/>
  <text x="112" y="461" font-family="Segoe UI,Arial" font-size="12" fill="#8a5a12">* Required field</text>
</svg>
