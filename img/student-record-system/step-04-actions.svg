<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Action buttons</title><desc id="desc">Four clearly labeled buttons show Add, Update, Clear, and Delete actions with their meanings.</desc>
  <rect width="900" height="420" rx="20" fill="#eef3f7"/>
  <text x="450" y="59" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="800" fill="#526173">ACTION BUTTON ARRANGEMENT</text>
  <g font-family="Segoe UI,Arial">
    <rect x="55" y="103" width="180" height="88" rx="14" fill="#1d5f91"/><circle cx="95" cy="147" r="17" fill="#fff" opacity=".2"/><path d="M87 147h16M95 139v16" stroke="#fff" stroke-width="3"/><text x="165" y="155" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">ADD</text>
    <rect x="255" y="103" width="180" height="88" rx="14" fill="#fff" stroke="#97a9b8" stroke-width="2"/><circle cx="295" cy="147" r="17" fill="#e8f3fa"/><path d="M287 153l2-10 8-8 8 8-8 8z" fill="#1d5f91"/><text x="365" y="155" text-anchor="middle" font-size="19" font-weight="800" fill="#173b66">UPDATE</text>
    <rect x="455" y="103" width="180" height="88" rx="14" fill="#fff" stroke="#97a9b8" stroke-width="2"/><circle cx="495" cy="147" r="17" fill="#f0f3f6"/><path d="M486 147a9 9 0 1 0 3-7M486 139v8h8" fill="none" stroke="#526173" stroke-width="3"/><text x="565" y="155" text-anchor="middle" font-size="19" font-weight="800" fill="#173b66">CLEAR</text>
    <rect x="655" y="103" width="180" height="88" rx="14" fill="#a63838"/><circle cx="695" cy="147" r="17" fill="#fff" opacity=".18"/><path d="M688 141h14M691 141v14h8v-14M693 137h4" fill="none" stroke="#fff" stroke-width="2"/><text x="765" y="155" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">DELETE</text>
    <path d="M145 191v47M345 191v47M545 191v47M745 191v47" stroke="#8b9cac" stroke-width="3"/>
    <rect x="55" y="238" width="180" height="105" rx="12" fill="#fff"/><text x="145" y="274" text-anchor="middle" font-size="16" font-weight="800" fill="#102b4e">Primary action</text><text x="145" y="301" text-anchor="middle" font-size="13" fill="#526173">Creates a new</text><text x="145" y="321" text-anchor="middle" font-size="13" fill="#526173">student record</text>
    <rect x="255" y="238" width="180" height="105" rx="12" fill="#fff"/><text x="345" y="274" text-anchor="middle" font-size="16" font-weight="800" fill="#102b4e">Edit action</text><text x="345" y="301" text-anchor="middle" font-size="13" fill="#526173">Revises the</text><text x="345" y="321" text-anchor="middle" font-size="13" fill="#526173">selected record</text>
    <rect x="455" y="238" width="180" height="105" rx="12" fill="#fff"/><text x="545" y="274" text-anchor="middle" font-size="16" font-weight="800" fill="#102b4e">Reset action</text><text x="545" y="301" text-anchor="middle" font-size="13" fill="#526173">Returns the form</text><text x="545" y="321" text-anchor="middle" font-size="13" fill="#526173">to a blank state</text>
    <rect x="655" y="238" width="180" height="105" rx="12" fill="#fff"/><text x="745" y="274" text-anchor="middle" font-size="16" font-weight="800" fill="#a63838">Destructive action</text><text x="745" y="301" text-anchor="middle" font-size="13" fill="#526173">Requires user</text><text x="745" y="321" text-anchor="middle" font-size="13" fill="#526173">confirmation</text>
  </g>
</svg>
