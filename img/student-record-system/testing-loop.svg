<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Testing and debugging loop</title><desc id="desc">Five connected stages show preparing test data, running the form, comparing results, correcting logic, and retesting.</desc>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#71879a"/></marker></defs>
  <rect width="1000" height="440" rx="24" fill="#f3f7fa"/>
  <text x="500" y="53" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="800" fill="#526173">SYSTEMATIC TESTING LOOP</text>
  <g stroke="#71879a" stroke-width="4" fill="none" marker-end="url(#ar)"><path d="M211 200h57"/><path d="M407 200h57"/><path d="M603 200h57"/><path d="M799 200h50"/><path d="M910 266c0 92-95 115-410 115-319 0-414-23-414-115"/></g>
  <g font-family="Segoe UI,Arial">
    <rect x="45" y="132" width="166" height="136" rx="17" fill="#fff" stroke="#9fb0bf" stroke-width="2"/><circle cx="128" cy="166" r="20" fill="#1d5f91"/><text x="128" y="173" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">1</text><text x="128" y="211" text-anchor="middle" font-size="17" font-weight="800" fill="#102b4e">PREPARE</text><text x="128" y="237" text-anchor="middle" font-size="13" fill="#526173">Choose test data</text>
    <rect x="241" y="132" width="166" height="136" rx="17" fill="#e8f3fa" stroke="#1d5f91" stroke-width="2"/><circle cx="324" cy="166" r="20" fill="#1d5f91"/><text x="324" y="173" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">2</text><text x="324" y="211" text-anchor="middle" font-size="17" font-weight="800" fill="#102b4e">RUN</text><text x="324" y="237" text-anchor="middle" font-size="13" fill="#526173">Perform the action</text>
    <rect x="437" y="132" width="166" height="136" rx="17" fill="#fff5dc" stroke="#c99432" stroke-width="2"/><circle cx="520" cy="166" r="20" fill="#c99432"/><text x="520" y="173" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">3</text><text x="520" y="211" text-anchor="middle" font-size="17" font-weight="800" fill="#102b4e">COMPARE</text><text x="520" y="237" text-anchor="middle" font-size="13" fill="#526173">Expected vs. actual</text>
    <rect x="633" y="132" width="166" height="136" rx="17" fill="#f7e9e9" stroke="#a63838" stroke-width="2"/><circle cx="716" cy="166" r="20" fill="#a63838"/><text x="716" y="173" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">4</text><text x="716" y="211" text-anchor="middle" font-size="17" font-weight="800" fill="#102b4e">CORRECT</text><text x="716" y="237" text-anchor="middle" font-size="13" fill="#526173">Repair the issue</text>
    <rect x="829" y="132" width="126" height="136" rx="17" fill="#e9f6f1" stroke="#1d7257" stroke-width="2"/><circle cx="892" cy="166" r="20" fill="#1d7257"/><text x="892" y="173" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">5</text><text x="892" y="211" text-anchor="middle" font-size="17" font-weight="800" fill="#102b4e">RETEST</text><text x="892" y="237" text-anchor="middle" font-size="13" fill="#526173">Confirm the fix</text>
    <rect x="377" y="344" width="246" height="54" rx="27" fill="#102b4e"/><text x="500" y="378" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">REPEAT UNTIL RELIABLE</text>
  </g>
</svg>
